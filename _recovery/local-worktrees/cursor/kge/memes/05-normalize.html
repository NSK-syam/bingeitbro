<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.post {
    width: 1080px; height: 1080px;
    background: #0a0a0a;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 100px;
    text-align: center;
    position: relative;
}
.text {
    font-size: 58px;
    font-weight: 900;
    color: #fff;
    line-height: 1.35;
    max-width: 820px;
}
.dim { color: rgba(255,255,255,.3); }
.orange { color: #f97316; }
.bottom {
    position: absolute; bottom: 50px;
    font-size: 24px; color: rgba(255,255,255,.15);
}
</style>
</head><body>
<div class="post">
    <div class="text">
        normalize asking<br>
        your friends<br>
        what to watch<br><br>
        <span class="dim">instead of scrolling<br>for 30 minutes and<br>choosing <span class="orange">nothing</span></span>
    </div>
    <div class="bottom">bingeitbro.com</div>
</div>
</body></html>
