<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.post {
    width: 1080px; height: 1080px;
    background: #0a0a0a;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 90px;
    text-align: center;
    position: relative;
}
.top {
    font-size: 28px; color: rgba(255,255,255,.3);
    margin-bottom: 36px; font-weight: 400;
}
.main {
    font-size: 56px; font-weight: 900; color: #fff;
    line-height: 1.3; margin-bottom: 48px;
    max-width: 800px;
}
.main .orange { color: #f97316; }
.sub {
    font-size: 28px; color: rgba(255,255,255,.35);
    line-height: 1.6; max-width: 700px;
}
.sub strong { color: rgba(255,255,255,.7); font-weight: 700; }
.badge {
    margin-top: 48px;
    padding: 14px 36px;
    border-radius: 100px;
    background: rgba(249,115,22,.1);
    border: 1px solid rgba(249,115,22,.2);
    font-size: 22px; font-weight: 700; color: #f97316;
}
.bottom {
    position: absolute; bottom: 44px;
    font-size: 20px; color: rgba(255,255,255,.12);
}
</style>
</head><body>
<div class="post">
    <div class="top">spotify wrapped is once a year</div>
    <div class="main">your <span class="orange">song playlist</span><br>on binge it bro<br>is forever</div>
    <div class="sub">share your taste publicly.<br><strong>let your friends discover what you're vibing to.</strong><br>update it anytime.</div>
    <div class="badge">🎵 share yours → bingeitbro.com</div>
    <div class="bottom">songs feature now live</div>
</div>
</body></html>
