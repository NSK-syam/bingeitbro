<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.post {
    width: 1080px; height: 1080px;
    background: #0a0a0a;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 70px 80px;
    position: relative;
}
.title {
    font-size: 36px; font-weight: 900; color: #fff;
    margin-bottom: 44px; text-align: center;
}
.ratings { display: flex; flex-direction: column; gap: 14px; }
.row {
    display: flex; align-items: center; gap: 20px;
    padding: 20px 28px;
    border-radius: 14px;
    background: rgba(255,255,255,.03);
}
.source {
    font-size: 20px; font-weight: 700; color: rgba(255,255,255,.35);
    width: 120px; flex-shrink: 0; text-transform: uppercase;
    letter-spacing: 1px;
}
.quote {
    font-size: 24px; color: rgba(255,255,255,.6);
    flex: 1; line-height: 1.4;
}
.stars { font-size: 22px; flex-shrink: 0; }
.row.friend {
    background: rgba(249,115,22,.08);
    border: 1px solid rgba(249,115,22,.15);
}
.row.friend .source { color: #f97316; }
.row.friend .quote { color: rgba(255,255,255,.85); font-weight: 600; }
.verdict {
    margin-top: 44px; text-align: center;
    font-size: 28px; color: rgba(255,255,255,.4);
    line-height: 1.6;
}
.verdict strong { color: #fff; }
.bottom {
    position: absolute; bottom: 44px; left: 0; right: 0;
    text-align: center; font-size: 20px; color: rgba(255,255,255,.15);
}
</style>
</head><body>
<div class="post">
    <div class="title">who do you trust?</div>
    <div class="ratings">
        <div class="row">
            <div class="source">IMDB</div>
            <div class="quote">"7.2/10 — a cinematic masterpiece"</div>
            <div class="stars">⭐⭐⭐</div>
        </div>
        <div class="row">
            <div class="source">Rotten T.</div>
            <div class="quote">"89% — critics love it"</div>
            <div class="stars">⭐⭐⭐</div>
        </div>
        <div class="row">
            <div class="source">Netflix</div>
            <div class="quote">"97% match for you"</div>
            <div class="stars">⭐⭐</div>
        </div>
        <div class="row">
            <div class="source">Google</div>
            <div class="quote">"top 10 movies of the year"</div>
            <div class="stars">⭐⭐</div>
        </div>
        <div class="row friend">
            <div class="source">Your friend</div>
            <div class="quote">"WATCH THIS. I literally cried for 2 hours."</div>
            <div class="stars">⭐⭐⭐⭐⭐</div>
        </div>
    </div>
    <div class="verdict">one of these actually knows <strong>your taste</strong>.</div>
    <div class="bottom">🍿 bingeitbro.com</div>
</div>
</body></html>
