<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.post {
    width: 1080px; height: 1080px;
    background: #0a0a0a;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 80px;
    text-align: center;
    position: relative;
}
.line1 {
    font-size: 42px; font-weight: 400; color: rgba(255,255,255,.45);
    line-height: 1.5; margin-bottom: 48px;
}
.line2 {
    font-size: 64px; font-weight: 900; color: #fff;
    line-height: 1.25; margin-bottom: 48px;
    max-width: 800px;
}
.line3 {
    font-size: 42px; font-weight: 400; color: rgba(255,255,255,.45);
    line-height: 1.5;
}
.accent { color: #f97316; }
.bottom {
    position: absolute; bottom: 50px;
    font-size: 22px; color: rgba(255,255,255,.2);
    letter-spacing: 1px;
}
</style>
</head><body>
<div class="post">
    <div class="line1">me scrolling Netflix for 30 minutes:</div>
    <div class="line2">"there's nothing to watch"</div>
    <div class="line3">my watchlist with <span class="accent">47 unwatched recommendations</span> from friends:</div>
    <div class="bottom">🍿 bingeitbro.com</div>
</div>
</body></html>
