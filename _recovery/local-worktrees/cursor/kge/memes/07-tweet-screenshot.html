<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.post {
    width: 1080px; height: 1080px;
    background: #0a0a0a;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 100px;
    position: relative;
}
.tweet {
    background: #111;
    border-radius: 20px;
    padding: 44px 48px;
    max-width: 820px;
    width: 100%;
    border: 1px solid rgba(255,255,255,.08);
}
.tweet-header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 24px;
}
.avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f97316, #ec4899);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
}
.name { font-size: 22px; font-weight: 700; color: #fff; }
.handle { font-size: 18px; color: rgba(255,255,255,.25); }
.tweet-text {
    font-size: 32px; color: rgba(255,255,255,.85);
    line-height: 1.55; font-weight: 400;
}
.tweet-text strong { color: #fff; font-weight: 700; }
.tweet-metrics {
    display: flex; gap: 40px; margin-top: 28px;
    padding-top: 20px; border-top: 1px solid rgba(255,255,255,.06);
}
.metric { font-size: 18px; color: rgba(255,255,255,.2); }
.metric b { color: rgba(255,255,255,.4); font-weight: 700; }
.reaction {
    margin-top: 48px; text-align: center;
    font-size: 28px; color: rgba(255,255,255,.35);
}
.bottom {
    position: absolute; bottom: 44px;
    font-size: 20px; color: rgba(255,255,255,.12);
}
</style>
</head><body>
<div class="post">
    <div class="tweet">
        <div class="tweet-header">
            <div class="avatar">🍿</div>
            <div>
                <div class="name">Binge It Bro</div>
                <div class="handle">@bingeitbro</div>
            </div>
        </div>
        <div class="tweet-text">
            the best movie recommendation I ever got wasn't from Netflix.<br><br>
            it was a <strong>2am text</strong> from my friend that said <strong>"just watch it. don't ask questions."</strong><br><br>
            that's the whole app.
        </div>
        <div class="tweet-metrics">
            <div class="metric"><b>4.2K</b> likes</div>
            <div class="metric"><b>891</b> retweets</div>
            <div class="metric"><b>234</b> replies</div>
        </div>
    </div>
    <div class="reaction">this is literally why we built this 😭</div>
    <div class="bottom">bingeitbro.com</div>
</div>
</body></html>
