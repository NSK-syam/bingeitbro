<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>March 13 OTT Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #140c13;
      --peach: #ffd2b5;
      --rose: #f091a6;
      --orange: #ff944d;
      --wine: #4a1f34;
      --paper: #fff8f2;
      --panel: rgba(31, 11, 24, 0.68);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, #46213b 0%, transparent 38%),
        radial-gradient(circle at 80% 85%, #5e1d2e 0%, transparent 35%),
        linear-gradient(145deg, #180c17 0%, #0e0a11 60%, #13080e 100%);
      font-family: "Bricolage Grotesque", sans-serif;
      color: var(--paper);
    }

    .canvas {
      width: min(1080px, calc(100vw - 28px));
      aspect-ratio: 4 / 5;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(circle at 12% 22%, rgba(255, 148, 77, 0.28), transparent 42%),
        radial-gradient(circle at 88% 5%, rgba(240, 145, 166, 0.34), transparent 35%),
        linear-gradient(180deg, #ffc9a9 0%, #ff9d78 32%, #cf6873 70%, #5a2847 100%);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.46);
      padding: 24px 24px 18px;
      isolation: isolate;
    }

    .canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          115deg,
          rgba(255, 255, 255, 0.07) 0,
          rgba(255, 255, 255, 0.07) 2px,
          transparent 2px,
          transparent 32px
        );
      opacity: 0.16;
      mix-blend-mode: soft-light;
      z-index: -1;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
      padding-right: 0;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .eyebrow {
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: clamp(10px, 1.15vw, 14px);
      font-weight: 800;
      color: #2f1527;
      background: rgba(255, 246, 237, 0.9);
      padding: 8px 14px;
      border-radius: 100px;
      border: 1px solid rgba(76, 29, 53, 0.22);
    }

    .headline-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    h1 {
      margin-top: 0;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(56px, 7vw, 80px);
      letter-spacing: 0.02em;
      line-height: 0.88;
      color: #2f1024;
      text-shadow: 0 2px 0 rgba(255, 246, 237, 0.45);
      text-align: left;
    }

    h1 span {
      color: #fff7f3;
      text-shadow: 0 6px 20px rgba(61, 19, 34, 0.32);
    }

    .sub {
      font-size: clamp(11px, 1.1vw, 14px);
      font-weight: 800;
      color: rgba(255, 248, 242, 0.9);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .logo-badge {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: auto;
      height: auto;
      padding: 0;
      background: none;
      border: none;
      box-shadow: none;
    }

    .logo-badge img {
      width: 180px;
      height: 102px;
      display: block;
      object-fit: contain;
      border-radius: 0;
      mix-blend-mode: multiply;
      filter: drop-shadow(0 6px 10px rgba(26, 8, 18, 0.16));
      opacity: 0.98;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      aspect-ratio: 0.87;
      min-height: 0;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.38);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
      transform: none;
      background: var(--poster-fallback);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(16, 7, 15, 0) 0%, rgba(16, 7, 15, 0.04) 62%, rgba(16, 7, 15, 0.68) 100%);
      z-index: 1;
    }

    .poster-stage {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 14px 76px;
      background:
        radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.12), transparent 34%),
        linear-gradient(180deg, rgba(20, 11, 20, 0.26) 0%, rgba(20, 11, 20, 0.5) 100%);
    }

    .poster-img {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 0;
      object-fit: contain;
      object-position: center;
      filter: saturate(1.06) contrast(1.02);
      border-radius: 14px;
      box-shadow: 0 18px 26px rgba(0, 0, 0, 0.34);
      background: rgba(16, 7, 15, 0.45);
    }

    .chip {
      position: absolute;
      z-index: 3;
      top: 14px;
      left: 14px;
      font-size: clamp(11px, 1.12vw, 13px);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 9px 13px;
      border-radius: 999px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.34);
      backdrop-filter: blur(6px);
      background: rgba(17, 10, 18, 0.54);
    }

    .meta {
      position: absolute;
      z-index: 3;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 13px;
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.42);
    }

    .slot-label {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: rgba(255, 248, 242, 0.9);
    }

    .line {
      font-size: 10px;
      font-weight: 700;
      opacity: 0.96;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .footer {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid rgba(255, 248, 242, 0.24);
      padding-top: 10px;
      font-size: clamp(12px, 1.4vw, 18px);
      color: rgba(255, 248, 242, 0.95);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff6ee;
      box-shadow: 0 0 0 6px rgba(255, 246, 238, 0.2);
    }

    .hint {
      opacity: 0.92;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: clamp(9px, 0.95vw, 12px);
    }

    @media (max-width: 900px) {
      .canvas {
        border-radius: 18px;
        padding: 22px;
      }

      .header {
        gap: 8px;
      }

      .title-row {
        gap: 10px;
      }

      .logo-badge {
        width: auto;
        height: auto;
      }

      .logo-badge img {
        width: 124px;
        height: 70px;
      }

      .grid {
        gap: 12px;
      }

      .card {
        min-height: 300px;
        border-radius: 14px;
      }

      .footer {
        margin-top: 14px;
        padding-top: 10px;
      }
    }

    body.export {
      padding: 0;
      background: #000;
    }

    body.export .canvas {
      width: 1080px;
      height: 1350px;
      aspect-ratio: auto;
      border-radius: 0;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <main class="canvas" role="img" aria-label="Instagram poster showing March 13 OTT releases across Netflix, Prime Video and ZEE5.">
    <header class="header">
      <div class="title-row">
        <div class="headline-block">
          <h1>Weekend's <span>Watchlist</span></h1>
        </div>
        <div class="logo-badge">
          <img src="bib/public/bib-logo.png" alt="Binge It Bro logo" loading="eager">
        </div>
      </div>
      <p class="sub">4 picks across Netflix, Prime Video and ZEE5</p>
    </header>

    <section class="grid">
      <article class="card" style="--tilt:-1.5deg; --poster-fallback: linear-gradient(145deg, #ec866f 0%, #ca4f62 52%, #522746 100%);">
        <div class="poster-stage">
          <img class="poster-img" src="post-assets/march-13-ott/made-in-korea.jpg" alt="Made in Korea poster" loading="eager" onerror="this.style.display='none'">
        </div>
        <span class="chip">Netflix</span>
        <div class="meta">
          <span class="slot-label">Made in Korea</span>
          <p class="line">Streaming now</p>
        </div>
      </article>

      <article class="card" style="--tilt:1.2deg; --poster-fallback: linear-gradient(145deg, #5b1d1e 0%, #8f322f 58%, #c96f58 100%);">
        <div class="poster-stage">
          <img class="poster-img" src="post-assets/march-13-ott/couple-friendly.jpg" alt="Couple Friendly poster" loading="eager" onerror="this.style.display='none'">
        </div>
        <span class="chip">Prime Video</span>
        <div class="meta">
          <span class="slot-label">Couple Friendly</span>
          <p class="line">Watch now</p>
        </div>
      </article>

      <article class="card" style="--tilt:1deg; --poster-fallback: linear-gradient(145deg, #ffb800 0%, #e98e00 48%, #5a2800 100%);">
        <div class="poster-stage">
          <img class="poster-img" src="post-assets/march-13-ott/funky.jpg" alt="Funky poster" loading="eager" onerror="this.style.display='none'">
        </div>
        <span class="chip">Netflix</span>
        <div class="meta">
          <span class="slot-label">Funky</span>
          <p class="line">Watch now</p>
        </div>
      </article>

      <article class="card" style="--tilt:-1deg; --poster-fallback: linear-gradient(145deg, #f5ac88 0%, #cc6f66 44%, #3a2638 100%);">
        <div class="poster-stage">
          <img class="poster-img" src="post-assets/march-13-ott/zee5-telugu-premiere.jpg" alt="ZEE5 Telugu premiere poster" loading="eager" onerror="this.style.display='none'">
        </div>
        <span class="chip">ZEE5</span>
        <div class="meta">
          <span class="slot-label">Telugu Premiere</span>
          <p class="line">Watch now</p>
        </div>
      </article>
    </section>

    <footer class="footer">
      <div class="brand"><span class="dot"></span> Binge It Bro</div>
      <p class="hint">Save for tonight</p>
    </footer>
  </main>
  <script>
    if (new URLSearchParams(window.location.search).get('export') === '1') {
      document.body.classList.add('export');
    }
  </script>
</body>
</html>
